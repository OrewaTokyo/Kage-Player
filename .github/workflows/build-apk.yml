name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["site.zip", "**.md"]   # a pushed site.zip is unpacked first; the unpack workflow then starts this build
concurrency:
  group: build-apk
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: write   # publishing the release needs this
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4   # caches Gradle so later builds are faster
      - name: Check the project is here
        run: |
          test -f gradlew || { echo "gradlew not found. Upload the Next Player source (site.zip) first."; exit 1; }
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Secret ANDROID_KEYSTORE_BASE64 is missing (Settings > Secrets and variables > Actions)."; exit 1; }
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Work out the version of this build
        id: ver
        run: |
          echo "name=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          # Minutes since 2023-11-14. It only ever goes up, so Android never sees a downgrade.
          echo "code=$(( ($(date +%s) - 1700000000) / 60 ))" >> "$GITHUB_OUTPUT"
      - name: Set the version (best effort, depends on how the project defines it)
        run: |
          F=$(grep -rlE 'versionCode\s*=' --include=build.gradle.kts --include=build.gradle . | head -1 || true)
          if [ -n "$F" ]; then
            sed -i -E 's/versionCode\s*=\s*[0-9]+/versionCode = ${{ steps.ver.outputs.code }}/; s/versionName\s*=\s*"[^"]*"/versionName = "${{ steps.ver.outputs.name }}"/' "$F"
            echo "Version set in $F"
          else
            echo "::warning::versionCode not found in a gradle file. The APK keeps the project's own version, so it may not install over the old one."
          fi
      - name: Check the XML files are valid
        run: |
          python3 - <<'PY'
          import pathlib, sys, xml.dom.minidom
          bad = 0
          for f in pathlib.Path('.').rglob('*.xml'):
              if 'src' not in f.parts or 'build' in f.parts:
                  continue
              try:
                  xml.dom.minidom.parse(str(f))
              except Exception as e:
                  bad += 1
                  print(f"::error file={f}::Invalid XML: {e}")
          sys.exit(1 if bad else 0)
          PY
      - name: Check the Kotlin code compiles (fast fail, shows the real error)
        id: compile
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew compileReleaseKotlin --console=plain --warning-mode summary 2>&1 | tee "$RUNNER_TEMP/compile.log"
      - name: Show what the compile error is
        if: failure() && steps.compile.outcome == 'failure'
        run: bash .github/scripts/summarize-build-errors.sh "$RUNNER_TEMP/compile.log" "Kotlin compile failed"
      - name: Build the release APK
        id: build
        shell: bash
        run: ./gradlew assembleRelease --console=plain --warning-mode summary 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Show what the build error is
        if: failure() && steps.build.outcome == 'failure'
        run: bash .github/scripts/summarize-build-errors.sh "$RUNNER_TEMP/build.log" "Release build failed"
      - name: Keep the Gradle logs of a failed build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: |
            ${{ runner.temp }}/compile.log
            ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Align and sign with your secret key
        id: sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ALIAS_ARG=""; [ -n "$ANDROID_KEY_ALIAS" ] && ALIAS_ARG="--ks-key-alias $ANDROID_KEY_ALIAS"
          APKS=""
          # Always the same two files, never "whichever was found first":
          #   arm64-v8a  = small, for almost every phone
          #   universal  = big, runs on any device
          for ABI in arm64-v8a universal; do
            IN=$(find . -path '*build/outputs/apk*' -name "*${ABI}*release*.apk" ! -name '*debug*' | head -1)
            if [ -z "$IN" ]; then echo "::warning::No $ABI release APK was built"; continue; fi
            echo "Built ($ABI): $IN ($(du -h "$IN" | cut -f1))"
            OUT="KagePlayer-v${VERSION_NAME}-${ABI}.apk"
            "$BT/zipalign" -p -f 4 "$IN" "$RUNNER_TEMP/aligned-$ABI.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:ANDROID_KEYSTORE_PASSWORD $ALIAS_ARG --out "$OUT" "$RUNNER_TEMP/aligned-$ABI.apk"
            "$BT/apksigner" verify --print-certs "$OUT" | tee "$RUNNER_TEMP/certs-$ABI.txt"
            APKS="${APKS}${OUT}"$'\n'
            KEY=$(grep 'SHA-256 digest' "$RUNNER_TEMP/certs-$ABI.txt" | head -1 | awk '{print $NF}')
          done
          rm -f "$RUNNER_TEMP/release.jks"
          test -n "$APKS" || { echo "::error::No release APK found"; exit 1; }
          {
            echo "apks<<APKS_END"
            printf '%s' "$APKS"
            echo "APKS_END"
            echo "key=$KEY"
          } >> "$GITHUB_OUTPUT"
      - name: Publish a new release for this build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Kage Player v${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          body: "Most phones: download the arm64-v8a file (small). If it will not install, use the universal file (big, runs on any device). Both install over the previous version: same signing key (SHA-256 ${{ steps.sign.outputs.key }}), version code ${{ steps.ver.outputs.code }}."
          generate_release_notes: true
          make_latest: true
          files: ${{ steps.sign.outputs.apks }}
