name: Rename to Kage Player
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set the app name and package ID (stops with no changes if a line is not found)
        run: |
          F=app/build.gradle.kts
          grep -Eq 'applicationId\s*=\s*"[^"]*"' "$F" || { echo "::error::applicationId line not found in $F"; grep -n applicationId "$F" || true; exit 1; }
          sed -i -E 's/(applicationId\s*=\s*)"[^"]*"/\1"app.kage.player"/' "$F"
          grep -n 'applicationId' "$F"
          FOUND=0
          for f in $(grep -rl '<string name="app_name"' --include=strings.xml . | grep -E '/res/values/strings.xml$' || true); do
            sed -i -E 's#(<string name="app_name"[^>]*>)[^<]*(</string>)#\1Kage Player\2#' "$f"
            echo "app name set in $f"; FOUND=1
          done
          [ "$FOUND" = 1 ] || { echo "::error::app_name string not found"; exit 1; }
      - name: Remove the original project's AI-agent tooling
        run: |
          rm -rf .agents docs/agents
          rmdir docs 2>/dev/null || true
      - name: Rename in the README
        run: sed -i '1s/.*/# Kage Player/' README.md
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Rename to Kage Player (app name, package ID), remove agent tooling" || echo "Nothing to commit"
          git push
      - name: Start the APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apk.yml || true
